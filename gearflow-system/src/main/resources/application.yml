spring:
  application:
    name: gearflow-system

  devtools:
    add-properties: false

  datasource:
    url: jdbc:mysql://localhost:3306/gearflow
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  error:
    include-stacktrace: never
    include-message: always